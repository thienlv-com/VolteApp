plugins {
    id 'com.android.application'
}

android {
    namespace 'vn.volte.enabler'
    compileSdk 35

    defaultConfig {
        applicationId 'vn.volte.enabler'
        minSdk 30
        targetSdk 35
        versionCode 2
        versionName '2.0'
        // Chỉ điện thoại ARM thật; bỏ x86 của Conscrypt để APK nhỏ hơn
        ndk {
            abiFilters 'arm64-v8a', 'armeabi-v7a'
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        resources {
            excludes += ['META-INF/versions/9/OSGI-INF/MANIFEST.MF', 'META-INF/*.kotlin_module']
        }
    }
}

dependencies {
    // ADB client thuần Java: ghép đôi + kết nối Gỡ lỗi không dây ngay trên máy
    implementation 'com.github.MuntashirAkon:libadb-android:3.1.1'
    // TLS 1.3 + exportKeyingMaterial cho giao thức ghép đôi ADB
    implementation 'org.conscrypt:conscrypt-android:2.5.3'
    // Tạo chứng chỉ X.509 cho khoá ADB của app
    implementation 'org.bouncycastle:bcpkix-jdk15to18:1.81'
}
